    <rect x="180" y="118" width="120" height="130" rx="26" fill="url(#bone)"/>
    <circle cx="176" cy="122" r="30" fill="url(#bone)"/>
    <circle cx="304" cy="122" r="30" fill="url(#bone)"/>
    <circle cx="176" cy="244" r="30" fill="url(#bone)"/>
    <circle cx="304" cy="244" r="30" fill="url(#bone)"/>
    <rect x="204" y="142" width="72" height="84" rx="18" fill="url(#marrow)"/>
    <g fill="#fecdd3" opacity="0.85">
      <circle cx="226" cy="164" r="7"/><circle cx="252" cy="156" r="5"/><circle cx="262" cy="180" r="8"/>
      <circle cx="234" cy="190" r="6"/><circle cx="218" cy="206" r="5"/><circle cx="252" cy="208" r="7"/>
    </g>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="240" y="46" fill="#d8b4fe" font-size="13" letter-spacing="6" font-weight="700">BONE MARROW</text>
    <text x="240" y="336" fill="rgba(240,171,252,0.55)" font-size="10" letter-spacing="3">STEM CELL · HLA TYPED</text>
